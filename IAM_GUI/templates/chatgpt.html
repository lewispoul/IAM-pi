<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM ChatGPT Agent - Interface Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: 20%;
        }
        .agent-message {
            background-color: #f5f5f5;
            margin-right: 20%;
        }
        .system-message {
            background-color: #ffebee;
            font-style: italic;
        }
        #messageInput {
            resize: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">🤖 IAM ChatGPT Agent - GOD MODE</h1>
                <div id="statusBar" class="alert alert-success">
                    ⚡ GOD MODE activé - Accès système illimité
                </div>
            </div>
        </div>

        <div class="chat-container border rounded p-3 mb-3" id="chatContainer">
            <div class="message system-message">
                🚀 Agent IAM prêt - Tapez votre message ci-dessous
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <form id="chatForm" class="input-group">
                    <textarea 
                        class="form-control" 
                        id="messageInput" 
                        rows="2" 
                        placeholder="Votre message..."
                        required
                    ></textarea>
                    <button class="btn btn-primary" type="submit">Envoyer</button>
                </form>
                <button id="resetBtn" class="btn btn-outline-danger mt-2">
                    🔄 Nouvelle conversation
                </button>
            </div>
        </div>
    </div>

    <script>
        let conversationId = null;

        // Fonction pour ajouter un message au chat
        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Gestionnaire de soumission du formulaire
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            // Afficher le message utilisateur
            addMessage(message, 'user');
            messageInput.value = '';

            try {
                // Envoyer au serveur
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: conversationId
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                // Mettre à jour l'ID de conversation
                conversationId = data.conversation_id;
                
                // Afficher la réponse
                addMessage(data.response, 'agent');
            } catch (error) {
                addMessage(`❌ Erreur: ${error.message}`, 'system');
            }
        };

        // Gestionnaire pour réinitialiser la conversation
        resetBtn.onclick = async () => {
            if (!conversationId) return;

            try {
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ conversation_id: conversationId })
                });

                // Vider le chat et réinitialiser
                chatContainer.innerHTML = '<div class="message system-message">🔄 Nouvelle conversation démarrée</div>';
                conversationId = null;
            } catch (error) {
                addMessage(`❌ Erreur lors de la réinitialisation: ${error.message}`, 'system');
            }
        };
    </script>
</body>
</html>
