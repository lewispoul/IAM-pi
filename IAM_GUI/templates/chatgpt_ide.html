<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM ChatGPT Agent - Interface IDE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/xterm.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }
        .main-container {
            height: calc(100vh - 60px);
        }
        .panel {
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
        }
        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: 20%;
        }
        .agent-message {
            background-color: #f5f5f5;
            margin-right: 20%;
        }
        .system-message {
            background-color: #ffebee;
            font-style: italic;
        }
        #messageInput {
            resize: none;
        }
        #editor {
            height: 300px;
            border: 1px solid #ccc;
        }
        #terminal {
            height: 300px;
            background-color: #1e1e1e;
            padding: 10px;
        }
        .activity-log {
            height: 200px;
            overflow-y: auto;
            background-color: #f8f9fa;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .tab-content {
            height: calc(100% - 42px);
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🤖 IAM ChatGPT Agent - GOD MODE</span>
            <div class="d-flex">
                <div id="statusBar" class="text-light">
                    ⚡ GOD MODE activé - Accès système illimité
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-container">
        <div class="row h-100">
            <!-- Left Panel: Chat -->
            <div class="col-md-4 panel">
                <div class="chat-container border rounded p-3 mb-3" id="chatContainer">
                    <div class="message system-message">
                        🚀 Agent IAM prêt - Tapez votre message ci-dessous
                    </div>
                </div>
                <form id="chatForm" class="mt-2">
                    <div class="input-group">
                        <textarea 
                            class="form-control" 
                            id="messageInput" 
                            rows="2" 
                            placeholder="Votre message..."
                            required
                        ></textarea>
                        <button class="btn btn-primary" type="submit">Envoyer</button>
                    </div>
                </form>
                <button id="resetBtn" class="btn btn-outline-danger mt-2 w-100">
                    🔄 Nouvelle conversation
                </button>
            </div>

            <!-- Right Panel: IDE & Terminal -->
            <div class="col-md-8 panel">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#editorTab">🐍 Python Editor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#terminalTab">🖥️ Terminal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#activityTab">📊 Agent Activity</a>
                    </li>
                </ul>

                <div class="tab-content border-start border-end border-bottom p-3">
                    <!-- Python Editor Tab -->
                    <div class="tab-pane fade show active" id="editorTab">
                        <div id="editor">print("Hello from IAM ChatGPT Agent!")</div>
                        <div class="mt-2">
                            <button class="btn btn-success" id="runCode">▶️ Exécuter</button>
                            <button class="btn btn-secondary" id="clearCode">🗑️ Effacer</button>
                        </div>
                        <div class="mt-2 border rounded p-2 bg-light">
                            <strong>Sortie:</strong>
                            <pre id="codeOutput" class="mt-2"></pre>
                        </div>
                    </div>

                    <!-- Terminal Tab -->
                    <div class="tab-pane fade" id="terminalTab">
                        <div id="terminal"></div>
                    </div>

                    <!-- Agent Activity Tab -->
                    <div class="tab-pane fade" id="activityTab">
                        <div class="activity-log" id="activityLog"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/xterm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <script>
        let conversationId = null;
        let editor = null;
        let terminal = null;
        let socket = null;
        let currentTerminalId = null;

        // Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: 'print("Hello from IAM ChatGPT Agent!")',
                language: 'python',
                theme: 'vs-dark',
                minimap: { enabled: false }
            });
        });

        // Initialize Terminal
        function initTerminal() {
            terminal = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                theme: {
                    background: '#1e1e1e'
                }
            });
            terminal.open(document.getElementById('terminal'));
            
            // Connect to WebSocket and create new terminal session
            socket = io();
            
            socket.on('connect', () => {
                socket.emit('create_terminal', {}, (response) => {
                    currentTerminalId = response.terminal_id;
                });
            });
            
            socket.on('terminal_output', (data) => {
                if (data.terminal_id === currentTerminalId) {
                    terminal.write(data.output);
                }
            });
            
            // Handle terminal input
            terminal.onData(data => {
                socket.emit('terminal_input', {
                    terminal_id: currentTerminalId,
                    input: data
                });
            });
        }

        // Initialize everything when document is ready
        document.addEventListener('DOMContentLoaded', () => {
            initTerminal();
            
            // Handle code execution
            document.getElementById('runCode').onclick = async () => {
                const code = editor.getValue();
                try {
                    const response = await fetch('/api/execute', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        document.getElementById('codeOutput').textContent = `Error: ${data.error}`;
                    } else {
                        document.getElementById('codeOutput').textContent = data.output || 'No output';
                    }
                } catch (error) {
                    document.getElementById('codeOutput').textContent = `Error: ${error.message}`;
                }
            };

            // Handle code clear
            document.getElementById('clearCode').onclick = () => {
                editor.setValue('');
            };
        });

        // Chat functionality
        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Log agent activity
        function logActivity(activity) {
            const logDiv = document.getElementById('activityLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${activity}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Handle chat form submission
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';
            logActivity(`📤 User: ${message}`);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: conversationId
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                conversationId = data.conversation_id;
                addMessage(data.response, 'agent');
                logActivity(`📥 Agent: ${data.response}`);
            } catch (error) {
                addMessage(`❌ Error: ${error.message}`, 'system');
                logActivity(`❌ Error: ${error.message}`);
            }
        };

        // Handle conversation reset
        resetBtn.onclick = async () => {
            if (!conversationId) return;

            try {
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ conversation_id: conversationId })
                });

                chatContainer.innerHTML = '<div class="message system-message">🔄 Nouvelle conversation démarrée</div>';
                conversationId = null;
                logActivity('🔄 Conversation reset');
            } catch (error) {
                addMessage(`❌ Error: ${error.message}`, 'system');
                logActivity(`❌ Error: ${error.message}`);
            }
        };

        // Handle WebSocket events for agent activity
        if (socket) {
            socket.on('agent_activity', (data) => {
                switch (data.action) {
                    case 'chat':
                        logActivity(`💬 Chat: ${data.message} -> ${data.response}`);
                        break;
                    case 'execute':
                        logActivity(`🐍 Code executed:\n${data.code}\nResult: ${data.result.output || 'No output'}`);
                        break;
                }
            });
        }
    </script>
</body>
</html>
